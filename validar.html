<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Accesos</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #ffffff; }
    .card-validar { border-radius: 20px; border: none; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card card-validar bg-dark text-white p-4 text-center shadow-lg w-100" style="max-width: 400px;">
    
    <!-- Estado de carga inicial -->
    <div id="loadingBox" class="py-4">
      <div class="spinner-border text-warning mb-3" role="status"></div>
      <p class="fs-5 fw-semibold mb-0">Verificando invitación...</p>
    </div>

    <!-- Interfaz de Confirmación -->
    <div id="resultadoBox" class="d-none">
      <h3 id="nombreInvitado" class="h4 mb-1">---</h3>
      <p id="infoPases" class="text-muted mb-3">---</p>
      
      <div id="alertBox" class="alert py-3 px-2 fw-bold fs-5 mb-3 d-none" role="alert"></div>

      <!-- Botón que activa la resta y el cierre automático -->
      <button id="btnValidar" class="btn btn-success btn-lg w-100 py-3 rounded-pill fw-bold mb-2">
         Confirmar Entrada (-1 Pase)
      </button>

      <small id="closeMessage" class="text-muted d-block mt-2"></small>
    </div>

  </div>

  <script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbzDHN2CCxipYYqSAuMFvG-BcZtURRQmM34dH8_KBChDsP8K-OHrHYIG82dc4vge0Tbo/exec";
    let idInvitacion = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      idInvitacion = params.get("id");

      const loadingBox = document.getElementById("loadingBox");
      const resultadoBox = document.getElementById("resultadoBox");
      const alertBox = document.getElementById("alertBox");
      const btnValidar = document.getElementById("btnValidar");

      if (!idInvitacion) {
        loadingBox.classList.add("d-none");
        resultadoBox.classList.remove("d-none");
        btnValidar.classList.add("d-none");
        alertBox.className = "alert alert-danger fw-bold fs-5";
        alertBox.textContent = "Error: QR sin ID válido";
        alertBox.classList.remove("d-none");
        return;
      }

      try {
        // Consulta rápida (GET) solo para verificar datos antes de descontar
        const res = await fetch(`${URL_BACKEND}?id=${idInvitacion}`);
        const data = await res.json();
        
        loadingBox.classList.add("d-none");
        resultadoBox.classList.remove("d-none");

        if (data.ok && data.pasesRestantes > 0) {
          document.getElementById("nombreInvitado").textContent = data.nombre;
          document.getElementById("infoPases").textContent = `Pases disponibles: ${data.pasesRestantes} de ${data.pasesTotales}`;
        } else {
          btnValidar.classList.add("d-none");
          alertBox.className = "alert alert-danger fw-bold fs-5";
          alertBox.textContent = "Sin pases disponibles o invitación no encontrada.";
          alertBox.classList.remove("d-none");
        }

      } catch (error) {
        console.error("Error al consultar la BD:", error);
        loadingBox.classList.add("d-none");
        resultadoBox.classList.remove("d-none");
        btnValidar.classList.add("d-none");
        alertBox.className = "alert alert-warning fw-bold fs-5";
        alertBox.textContent = "Error de conexión con el servidor.";
        alertBox.classList.remove("d-none");
      }

      // Listener para el botón de confirmar
      btnValidar.addEventListener("click", ejecutarDescuentoYCierre);
    });

    async function ejecutarDescuentoYCierre() {
      const btnValidar = document.getElementById("btnValidar");
      const alertBox = document.getElementById("alertBox");
      const closeMessage = document.getElementById("closeMessage");

      // Deshabilitar botón durante la petición
      btnValidar.disabled = true;
      btnValidar.textContent = "Procesando...";

      try {
        const res = await fetch(URL_BACKEND, {
          method: "POST",
          body: JSON.stringify({
            accion: "descontar",
            id: idInvitacion
          })
        });

        const data = await res.json();

        btnValidar.classList.add("d-none");
        alertBox.classList.remove("d-none");

        if (data.acceso) {
          alertBox.className = "alert alert-success fw-bold fs-5";
          alertBox.textContent = data.mensaje;
        } else {
          alertBox.className = "alert alert-danger fw-bold fs-5";
          alertBox.textContent = data.mensaje;
        }

        closeMessage.textContent = "Cerrando pestaña en 2 segundos...";

        // Cierre automático post-interacción
        setTimeout(() => {
          window.close();
        }, 2000);

      } catch (error) {
        console.error("Error al descontar pase:", error);
        btnValidar.disabled = false;
        btnValidar.textContent = "Reintentar Confirmación";
        alertBox.className = "alert alert-danger fw-bold fs-6";
        alertBox.textContent = "Error de red al actualizar la base de datos.";
        alertBox.classList.remove("d-none");
      }
    }
  </script>
</body>
</html>
