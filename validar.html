<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación de Accesos</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #ffffff; }
    .card-validar { border-radius: 20px; border: none; }
    .pin-input {
      letter-spacing: 12px;
      font-size: 1.8rem;
      text-align: center;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card card-validar bg-dark text-white p-4 text-center shadow-lg w-100" style="max-width: 400px;">
    
    <!-- Carga inicial -->
    <div id="loadingBox" class="py-4">
      <div class="spinner-border text-warning mb-3" role="status"></div>
      <p class="fs-5 fw-semibold mb-0">Verificando pase...</p>
    </div>

    <!-- Contenido principal -->
    <div id="resultadoBox" class="d-none">
      <h3 id="nombreInvitado" class="h4 mb-1">---</h3>
      <p id="infoPases" class="text-muted mb-3">---</p>

      <!-- Mensajes de respuesta -->
      <div id="alertBox" class="alert py-3 px-2 fw-bold fs-6 mb-3 d-none" role="alert"></div>

      <!-- Formulario PIN del Staff -->
      <form id="formPin" class="mb-2">
        <label for="pinInput" class="form-label small text-muted">Ingresa el PIN del Staff para restar pase:</label>
        <input type="password" id="pinInput" class="form-control form-control-lg bg-secondary text-white border-0 pin-input mb-3" maxlength="4" placeholder="••••" required autocomplete="off">
        
        <button type="submit" id="btnValidar" class="btn btn-success btn-lg w-100 py-3 rounded-pill fw-bold">
           Confirmar Entrada (-1)
        </button>
      </form>

      <small id="closeMessage" class="text-muted d-block mt-2"></small>
    </div>

  </div>

  <script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwInFV6DhfLpmOQsA6m9WI3Da0Zk58dyFayoFpFgp_Gv-1PEE4NTsYxpys21neiXPyl/exec";
    let idInvitacion = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      idInvitacion = params.get("id");

      const loadingBox = document.getElementById("loadingBox");
      const resultadoBox = document.getElementById("resultadoBox");

      if (!idInvitacion) {
        loadingBox.classList.add("d-none");
        resultadoBox.classList.remove("d-none");
        document.getElementById("formPin").classList.add("d-none");
        mostrarAlerta("Error: QR sin ID válido", "alert-danger");
        return;
      }

      try {
        // Consulta datos basicos del invitado sin descontar
        const res = await fetch(`${URL_BACKEND}?id=${idInvitacion}`);
        const data = await res.json();
        
        loadingBox.classList.add("d-none");
        resultadoBox.classList.remove("d-none");

        if (data.ok && data.pasesRestantes > 0) {
          document.getElementById("nombreInvitado").textContent = data.nombre;
          document.getElementById("infoPases").textContent = `Pases disponibles: ${data.pasesRestantes} de ${data.pasesTotales}`;
        } else {
          document.getElementById("formPin").classList.add("d-none");
          mostrarAlerta("Sin pases disponibles o invitación no válida.", "alert-danger");
        }

      } catch (error) {
        console.error("Error al consultar la BD:", error);
        loadingBox.classList.add("d-none");
        resultadoBox.classList.remove("d-none");
        document.getElementById("formPin").classList.add("d-none");
        mostrarAlerta("Error de conexión con el servidor.", "alert-warning");
      }

      // Enviar PIN al backend al presionar el botón
      document.getElementById("formPin").addEventListener("submit", async (e) => {
        e.preventDefault();
        const pinIngresado = document.getElementById("pinInput").value;
        await ejecutarDescuento(pinIngresado);
      });
    });

    async function ejecutarDescuento(pin) {
      const btnValidar = document.getElementById("btnValidar");
      const formPin = document.getElementById("formPin");
      const closeMessage = document.getElementById("closeMessage");

      btnValidar.disabled = true;
      btnValidar.textContent = "Validando...";

      try {
        const res = await fetch(URL_BACKEND, {
          method: "POST",
          body: JSON.stringify({
            accion: "descontar",
            id: idInvitacion,
            pin: pin
          })
        });

        const data = await res.json();

        if (data.acceso) {
          formPin.classList.add("d-none");
          mostrarAlerta(data.mensaje, "alert-success");
          closeMessage.textContent = "Cerrando pestaña en 2 segundos...";

          setTimeout(() => {
            window.close();
          }, 2000);
        } else {
          btnValidar.disabled = false;
          btnValidar.textContent = "Confirmar Entrada (-1)";
          mostrarAlerta(data.mensaje, "alert-danger");
          document.getElementById("pinInput").value = "";
        }

      } catch (error) {
        console.error("Error al descontar pase:", error);
        btnValidar.disabled = false;
        btnValidar.textContent = "Reintentar";
        mostrarAlerta("Error de red al actualizar la base de datos.", "alert-danger");
      }
    }

    function mostrarAlerta(mensaje, tipoClase) {
      const alertBox = document.getElementById("alertBox");
      alertBox.className = `alert ${tipoClase} fw-bold fs-6 mb-3`;
      alertBox.textContent = mensaje;
      alertBox.classList.remove("d-none");
    }
  </script>
</body>
</html>
