<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts para tipografías elegantes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <title>Mis XV Años - Invitación Digital</title>

    <style>
        /* ==========================================================================
           VARIABLES DE COLOR - PALETA AZUL CELESTE Y PLATA
           ========================================================================== */
        :root {
            --color-principal: #2C5E8A;    /* Azul Celeste Profundo para contraste */
            --color-secundario: #87CEEB;   /* Azul Celeste Claro */
            --color-suave: #E0F2FE;        /* Fondo Azul Glacial */
            --color-acento: #4A90E2;       /* Azul Intermedio */
            --color-blanco: #FFFFFF;
            --color-oscuro: #1A2B3C;
            --font-cursive: 'Alex Brush', cursive, serif;
            --font-body: 'Montserrat', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-body);
            color: var(--color-oscuro);
            background-color: #F4F9FC;
            overflow-x: hidden;
        }

        @font-face {
            font-family: 'TangerineBold';
            src: url('recursos/Tangerine-Bold.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* ==========================================================================
           HERO SECTION (AZUL CELESTE)
           ========================================================================== */
        .hero {
            position: relative;
            min-height: 100vh;
            background: url("recursos/misquince2.png") center center/cover no-repeat;
            background-color: var(--color-suave);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 40px 15px;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(44, 94, 138, 0.45) 0%, rgba(224, 242, 254, 0.6) 100%);
        }

        .hero-contenido {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 12px;
            padding: 0px;
        }

        .svg-curvo {
            width: min(320px, 80vw);
            height: auto;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.2));
        }

        .svg-icono {
            width: min(80px, 20vw);
            height: auto;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.2));
        }

        .svg-nombre {
            width: min(500px, 90vw);
            height: auto;
            filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.25));
        }

        /* ==========================================================================
           CONTADOR REGRESIVO
           ========================================================================== */
        .faltan {
            color: var(--color-blanco);
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            font-family: var(--font-cursive);
            letter-spacing: 2px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .contador {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: nowrap;
            margin: 10px 0;
        }

        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .numero {
            width: 75px;
            height: 85px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 48px;
            font-weight: 700;
            color: var(--color-principal);
            box-shadow: 0 8px 20px rgba(44, 94, 138, 0.25);
            border: 2px solid var(--color-secundario);
        }

        .item span {
            margin-top: 8px;
            color: var(--color-blanco);
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }

        .dospuntos {
            color: var(--color-blanco);
            font-size: 45px;
            margin-top: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
        }

        /* ==========================================================================
           BOTONES GENERALES
           ========================================================================== */
        .btn-confirmar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-decoration: none;
            color: var(--color-blanco);
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            padding: 18px 36px;
            border-radius: 60px;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 700;
            margin: 20px auto;
            transition: all .3s ease;
            box-shadow: 0 8px 22px rgba(37, 211, 102, 0.35);
            border: none;
        }

        .btn-confirmar:hover {
            transform: scale(1.04);
            color: var(--color-blanco);
            box-shadow: 0 12px 28px rgba(37, 211, 102, 0.45);
        }

        .icono-wa, .icono-maps {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        /* ==========================================================================
           SECCIONES DE CONTENIDO
           ========================================================================== */
        .tercera-seccion {
            background: linear-gradient(180deg, var(--color-suave) 0%, #FFFFFF 100%);
            padding: 70px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        .tercera-seccion span {
            display: block;
            max-width: 900px;
            text-align: center;
            color: var(--color-principal);
            font-size: clamp(1.8rem, 4.5vw, 3rem);
            font-family: var(--font-cursive);
            line-height: 1.3;
            padding: 0 20px;
        }

        .galeria-lugar {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .foto-lugar {
            width: 48%;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(44, 94, 138, 0.18);
            border: 3px solid var(--color-blanco);
        }

        .direccion-texto {
            font-family: var(--font-body) !important;
            font-size: clamp(1rem, 3.5vw, 1.25rem) !important;
            color: var(--color-oscuro) !important;
            font-weight: 500;
        }

        .link-mapa {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: linear-gradient(135deg, var(--color-principal) 0%, var(--color-acento) 100%);
            color: var(--color-blanco);
            text-decoration: none;
            padding: 18px 36px;
            border-radius: 60px;
            font-size: clamp(1.2rem, 4vw, 1.6rem);
            font-weight: 700;
            margin: 10px auto;
            box-shadow: 0 8px 22px rgba(44, 94, 138, 0.35);
            transition: .3s;
        }

        .link-mapa span {
            color: var(--color-blanco) !important;
            font-size: inherit !important;
            font-family: var(--font-body) !important;
            padding: 0 !important;
        }

        .link-mapa:hover {
            transform: scale(1.04);
            color: var(--color-blanco);
        }

        .cuarta-seccion {
            background: #ffffff;
            padding: 40px 20px;
            text-align: center;
        }

        .cuarta-seccion img {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            display: block;
            border-radius: 16px;
        }

        /* ==========================================================================
           CARRUSEL DE FOTOS
           ========================================================================== */
        .seccion-carrusel {
            background: var(--color-suave);
            padding: 70px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .titulo-carrusel {
            color: var(--color-principal);
            font-family: var(--font-cursive);
            font-size: clamp(2.8rem, 7vw, 4rem);
            margin-bottom: 25px;
            text-align: center;
        }

        #carruselQuince {
            max-width: 800px;
            margin: 0 auto;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(44, 94, 138, 0.2);
            border: 4px solid var(--color-blanco);
        }

        .img-carrusel {
            height: 500px;
            object-fit: cover;
            object-position: center;
        }

        /* ==========================================================================
           FORMULARIO DE CONFIRMACIÓN
           ========================================================================== */
        .quinta-seccion {
            background: #ffffff;
            padding: 70px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .quinta-seccion h2 {
            color: var(--color-principal);
            font-family: var(--font-cursive);
            font-size: clamp(2.8rem, 7vw, 4rem);
            margin-bottom: 30px;
            text-align: center;
        }

        .formulario-confirmacion {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .formulario-confirmacion input {
            width: 100%;
            padding: 18px 20px;
            font-size: clamp(1rem, 3vw, 1.2rem);
            border: 2px solid #D0E3F0;
            border-radius: 14px;
            box-sizing: border-box;
            outline: none;
            font-family: var(--font-body);
            background-color: #F8FCFF;
            transition: all 0.3s ease;
        }

        .formulario-confirmacion input:focus {
            border-color: var(--color-principal);
            background-color: #FFFFFF;
            box-shadow: 0 0 12px rgba(44, 94, 138, 0.15);
        }

        .formulario-confirmacion button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, var(--color-principal) 0%, var(--color-acento) 100%);
            color: var(--color-blanco);
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            font-weight: 700;
            cursor: pointer;
            transition: .25s;
            box-shadow: 0 8px 20px rgba(44, 94, 138, 0.3);
        }

        .formulario-confirmacion button:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 25px rgba(44, 94, 138, 0.4);
        }

        .formulario-confirmacion button:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        /* ==========================================================================
           RESPONSIVE (MÓVILES)
           ========================================================================== */
        @media(max-width: 768px) {
            .numero {
                width: 54px;
                height: 64px;
                font-size: 32px;
            }

            .dospuntos {
                font-size: 30px;
            }

            .item span {
                font-size: 13px;
            }

            .img-carrusel {
                height: 380px;
            }

            .galeria-lugar {
                gap: 10px;
            }

            .foto-lugar {
                width: 48%;
            }
        }

        @media(max-width: 480px) {
            .hero {
                padding: 20px 10px;
            }

            .link-mapa, .btn-confirmar {
                width: 95%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>

    <!-- HERO SECTION DE ENTRADA CON CONTADOR -->
    <section class="hero">
        <div class="hero-contenido">

            <img src="recursos/textocurvo2.svg" alt="Mis XV Años" class="svg-curvo">

            <img src="recursos/tiara.svg" alt="Corona XV" class="svg-icono">

            <img src="recursos/Elizabeth.svg" alt="Nombre Quinceañera" class="svg-nombre">

            <span class="faltan">Faltan</span>

            <div class="contador">
                <div class="item">
                    <div class="numero" id="dias">00</div>
                    <span>Días</span>
                </div>

                <div class="dospuntos">:</div>

                <div class="item">
                    <div class="numero" id="horas">00</div>
                    <span>Horas</span>
                </div>

                <div class="dospuntos">:</div>

                <div class="item">
                    <div class="numero" id="minutos">00</div>
                    <span>Min.</span>
                </div>

                <div class="dospuntos">:</div>

                <div class="item">
                    <div class="numero" id="segundos">00</div>
                    <span>Seg.</span>
                </div>
            </div>

            <img src="recursos/fechacurva.svg" alt="Fecha del Evento" class="svg-curvo">

        

        </div>
    </section>

    <!-- UBICACIÓN Y MENSAJE -->
    <section class="tercera-seccion">

        <span>"Los momentos felices de la vida se vuelven inolvidables cuando se comparten con quien más quieres"</span>

        <div class="galeria-lugar">
            <img src="recursos/Jardin10.png" alt="Lugar del evento 1" class="foto-lugar">
            <img src="recursos/Jardin11.png" alt="Lugar del evento 2" class="foto-lugar">
        </div>

        <span class="direccion-texto">Del Nogal M2 L14 Carretera Libre Tijuana Tecate 22253, Tijuana, B.C.</span>

        <a href="https://maps.app.goo.gl/Y1HMjhvRPz2Y8iDb6" target="_blank" class="link-mapa">
            <img src="recursos/maps.svg" alt="Mapa" class="icono-maps">
            <span>Ver ubicación en Google Maps</span>
        </a>

    </section>

    <!-- ITINERARIO -->
    <section class="cuarta-seccion">
        <img src="recursos/az.png" alt="Itinerario del Evento">
    </section>

    <!-- GALERÍA / CARRUSEL DE FOTOS -->
    <section class="seccion-carrusel">
        <div class="container">
            <h2 class="titulo-carrusel">Mis Momentos Especiales</h2>

            <div id="carruselQuince" class="carousel slide carousel-fade" data-bs-ride="carousel">

                <!-- Indicadores -->
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carruselQuince" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Foto 1"></button>
                    <button type="button" data-bs-target="#carruselQuince" data-bs-slide-to="1" aria-label="Foto 2"></button>
                    <button type="button" data-bs-target="#carruselQuince" data-bs-slide-to="2" aria-label="Foto 3"></button>
                    <button type="button" data-bs-target="#carruselQuince" data-bs-slide-to="3" aria-label="Foto 4"></button>
                    <button type="button" data-bs-target="#carruselQuince" data-bs-slide-to="4" aria-label="Foto 5"></button>
                </div>

                <!-- Diapositivas -->
                <div class="carousel-inner">
                    <div class="carousel-item active" data-bs-interval="2500">
                        <img src="recursos/misquince2.png" class="d-block w-100 img-carrusel" alt="Momento especial 1">
                    </div>
                    <div class="carousel-item" data-bs-interval="2500">
                        <img src="recursos/quinces0.jpg" class="d-block w-100 img-carrusel" alt="Momento especial 2">
                    </div>
                    <div class="carousel-item" data-bs-interval="2500">
                        <img src="recursos/quinces1.jpg" class="d-block w-100 img-carrusel" alt="Momento especial 3">
                    </div>
                    <div class="carousel-item" data-bs-interval="2500">
                        <img src="recursos/quinces3.jpg" class="d-block w-100 img-carrusel" alt="Momento especial 4">
                    </div>
                    <div class="carousel-item" data-bs-interval="2500">
                        <img src="recursos/quinces2.jpg" class="d-block w-100 img-carrusel" alt="Momento especial 5">
                    </div>
                </div>

                <!-- Controles -->
                <button class="carousel-control-prev" type="button" data-bs-target="#carruselQuince" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Anterior</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carruselQuince" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Siguiente</span>
                </button>

            </div>
        </div>
    </section>

    <!-- FORMULARIO DE CONFIRMACIÓN CON GOOGLE APPS SCRIPT -->
    <section class="quinta-seccion">

        <h2>Confirma tu Asistencia</h2>

        <div class="formulario-confirmacion">
            <input id="nombre" type="text" placeholder="Nombre completo">
            <input id="celular" type="tel" placeholder="Número de celular">
            <input id="asistentes" type="number" min="1" placeholder="Número de asistentes">

            <button id="btnRegistrar" onclick="registrar()">
                Confirmar asistencia
            </button>
        </div>

    </section>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // Fecha objetivo del evento
        const destino = new Date("November 20, 2026 18:00:00").getTime();

        function actualizar() {
            const ahora = new Date().getTime();
            const diferencia = destino - ahora;

            if (diferencia <= 0) {
                document.getElementById("dias").textContent = "00";
                document.getElementById("horas").textContent = "00";
                document.getElementById("minutos").textContent = "00";
                document.getElementById("segundos").textContent = "00";
                clearInterval(intervalo);
                return;
            }

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById("dias").textContent = String(dias).padStart(2, "0");
            document.getElementById("horas").textContent = String(horas).padStart(2, "0");
            document.getElementById("minutos").textContent = String(minutos).padStart(2, "0");
            document.getElementById("segundos").textContent = String(segundos).padStart(2, "0");
        }

        actualizar();
        const intervalo = setInterval(actualizar, 1000);

        // URL Endpoint de Google Apps Script
        const URL = "https://script.google.com/macros/s/AKfycbyVsIhOPEuUqQmZnUicuJJ3fCIoQLR7M3ihtAqnuNTOjddHrN5eLRtw3qcxOP7NE8kt/exec";

        async function registrar() {
            const boton = document.getElementById("btnRegistrar");

            boton.disabled = true;
            boton.innerHTML = "Registrando...";

            const datos = {
                nombre: document.getElementById("nombre").value.trim(),
                celular: document.getElementById("celular").value.trim(),
                asistentes: document.getElementById("asistentes").value.trim()
            };

            if (!datos.nombre || !datos.celular || !datos.asistentes) {
                alert("Por favor completa todos los campos.");
                boton.disabled = false;
                boton.innerHTML = "Confirmar asistencia";
                return;
            }

            try {
                const respuesta = await fetch(URL, {
                    method: "POST",
                    body: JSON.stringify(datos)
                });

                const json = await respuesta.json();

                alert(json.mensaje);

                if (json.ok) {
                    boton.innerHTML = "Confirmado ✓";
                    document.getElementById("nombre").value = "";
                    document.getElementById("celular").value = "";
                    document.getElementById("asistentes").value = "";
                    boton.disabled = true;
                } else {
                    boton.disabled = false;
                    boton.innerHTML = "Confirmar asistencia";
                }

            } catch (error) {
                alert("Error al registrar la asistencia.");
                console.error(error);
                boton.disabled = false;
                boton.innerHTML = "Confirmar asistencia";
            }
        }
    </script>

    <!-- Bootstrap Bundle JS -->
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
