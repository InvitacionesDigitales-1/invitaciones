<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Estadísticas</title>

<script src="js/chart.js"></script>

<style>

    @font-face{
    font-family:"PlayfairDisplayItalic";
    src:url("recursos/PlayfairDisplay-Italic-VariableFont_wght.ttf") format("truetype");
    font-weight:100 900;
    font-style:italic;
}

body {
    margin: 0;
    padding: 20px;
    font-family: "PlayfairDisplayItalic", serif;

    background-image: url("recursos/globos.png");
    background-repeat: no-repeat;   /* Evita que se repita */
    background-size: cover;         /* Cubre toda la pantalla */
    background-position: center;    /* Centra la imagen */
    background-attachment: fixed;   /* Opcional: fondo fijo al hacer scroll */
}


h1{

    text-align:center;

    font-size:clamp(2rem,5vw,3.5rem);

}


h2{

    text-align:center;

    font-size:clamp(1.5rem,4vw,2.5rem);

}


.contenedor{

    width:100%;

    max-width:1200px;

    margin:auto;

}


.grafica-contenedor{

    position:relative;

    width:100%;

    height:750px;

}



/* Tablets */

@media(max-width:900px){

    .grafica-contenedor{

        height:650px;

    }

}



/* Celulares */

@media(max-width:600px){

    body{

        padding:10px;

    }


    .grafica-contenedor{

        height:800px;

    }

}


</style>



</head>


<body>


<h1>
Confirmaciones
</h1>


<h2 id="total">
Cargando...
</h2>


<div class="contenedor">

    <div class="grafica-contenedor">

        <canvas id="grafica"></canvas>

    </div>

</div>



<script>


const URL="https://script.google.com/macros/s/AKfycbznvzCYb8UKBHIpKk7vl0u5USMbaNCfG-SIQP6-YcZ4zpctK60wlFDK575Nn0sbxSNr/exec";


let datosGlobal=[];



async function cargarDatos(){


    const respuesta = await fetch(URL);


    datosGlobal = await respuesta.json();



    let nombres=[];

    let asistentes=[];

    let total=0;



    datosGlobal.forEach(persona=>{


        nombres.push(persona.nombre);


        asistentes.push(Number(persona.asistentes));


        total += Number(persona.asistentes);


    });



    document.getElementById("total").innerHTML =
    "Total asistentes: " + total;



    crearGrafica(nombres, asistentes);


}




function crearGrafica(nombres, asistentes){

    const ctx = document.getElementById("grafica");


    new Chart(ctx, {

        type: "bar",

        data: {

            labels: nombres,

            datasets: [{

                label: "Número de asistentes",

                data: asistentes,

                backgroundColor: "#D12A93"

            }]

        },


        options: {

            indexAxis: "y",

            responsive: true,

            maintainAspectRatio: false,


           scales: {
        x: {
            beginAtZero: true,
            ticks: {
                stepSize: 1,
                color: "#000000",
                font: {
                    family: "PlayfairDisplayItalic",
                    size: 18,
                    weight: "bold"
                }
            }
        },
        y: {
            ticks: {
                color: "#000000",
                font: {
                    family: "PlayfairDisplayItalic",
                    size: 18,
                    weight: "bold"
                }
            }
        }
    },


            plugins: {

                legend: {

                    display: true

                },


                tooltip: {

                    callbacks: {

                        title: function(context){

                            let index = context[0].dataIndex;

                            return datosGlobal[index].nombre;

                        },


                        afterTitle: function(context){

                            let index = context[0].dataIndex;

                            return "Celular: " + datosGlobal[index].celular;

                        },


                        label: function(context){

                            return "Asistentes: " + context.raw;

                        }

                    }

                }

            }

        }

    });

}



cargarDatos();


</script>


</body>

</html>
