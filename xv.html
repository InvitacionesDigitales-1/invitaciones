<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación</title>

   <style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'TangerineBold', serif;
        color: black;
        background-color: #f8f9fa;
    }

    @font-face {
        font-family: 'TangerineBold';
        src: url('recursos/Tangerine-Bold.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }

  .hero{
    position:relative;
    min-height:100vh;
    background:url("recursos/misquince.jpg") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
}

.hero-contenido{

    position:relative;
    z-index:2;
    width:100%;
    max-width:900px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    gap:8px;

    padding:0px;

}

    .segunda-seccion {
        background: white;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
    }

 

  .cuarta-seccion{
    background:#fff;
}

.tercera-seccion{

    background:#D4A3B5;

    padding:60px 20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:35px;

}

.galeria-lugar{

    display:flex;
    justify-content:center;
    gap:20px;

    width:100%;
    max-width:1000px;

}

.foto-lugar{

    width:48%;
    border-radius:18px;
    object-fit:cover;

    box-shadow:0 10px 25px rgba(0,0,0,.20);

}

.cuarta-seccion img{
    width:100%;
    display:block;
}

.svg-curvo{

    width:min(320px,80vw);
    height:auto;

}

.svg-icono{

    width:min(80px,20vw);
    height:auto;

}

.svg-nombre{

    width:min(500px,90vw);
    height:auto;

}

.svg-fecha{

    width:min(220px,65vw);
    height:auto;

}

.faltan{

    color:white;

    font-size:60px;

    letter-spacing:2px;

    font-weight:bold;

}

.contador{

    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:12px;

    flex-wrap:nowrap;

}

.item{

    display:flex;

    flex-direction:column;

    align-items:center;

}

.numero{

    width:75px;

    height:85px;

    background:white;

    border-radius:8px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:60px;

    font-weight:bold;

    color:#c9a63a;

    box-shadow:0 8px 18px rgba(0,0,0,.30);


}

.item span{

    margin-top:8px;

    color:white;

    font-size:45px;

}

.dospuntos{

    color:white;

    font-size:55px;

    margin-top:10px;

    font-weight:bold;

}

@media(max-width:768px){

.svg-curvo{

    width:320px;

}

.svg-icono{

    width:100px;

}

.svg-nombre{

    width:220px;

}

.galeria-lugar{

    gap:10px;

}

.foto-lugar{

    width:48%;

}

.numero{

    width:52px;
    height:62px;

    font-size:32px;

}

.dospuntos{

    font-size:34px;

}

.item span{

    font-size:11px;

}

.faltan{

    font-size:22px;

}

}

    /* Contenedor principal del texto */
    .encabezado-seccion {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
    }

    /* Alinea el h1 y el SVG en la misma línea */
    .titulo-con-icono {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 15px; /* Aumentado para dar aire al icono más grande */
    }

    /* Título de la invitación (MÁS GRANDE) */
    .titulo-festejo {
        font-size: clamp(3rem, 10vw, 4.5rem); /* Escalado inicial más agresivo para móvil */
        color: white;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
        margin: 0 0 5px 0;
        text-align: center;
        font-weight: bold;
        line-height: 1.1;
    }

    /* SVG número 1: Al lado del texto (MÁS GRANDE) */
    .svg-al-lado {
        width: clamp(60px, 11vw, 80px); /* Incrementado el tamaño mínimo y máximo */
        height: auto;
        filter: drop-shadow(0px 2px 5px rgba(0,0,0,0.5));
    }



    /* SVG número 2: Abajo del texto (MÁS GRANDE) */
    .svg-abajo {
        width: 70px; /* Incrementado de 50px a 70px */
        height: auto;
        filter: drop-shadow(0px 3px 6px rgba(0,0,0,0.5));
    }

    /* Contenedor compacto que agrupa el título y la tarjeta */
    .contenedor-hero-vertical {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        gap: 20px; /* Más espacio entre elementos */
    }

  

    /* 2. ALTURA DE IMAGEN AJUSTADA AL NUEVO TAMAÑO */
    .foto img {
        display: block;
        width: 100%;
        height: 190px;            /* Subió de 140px a 190px proporcional al ancho */
        object-fit: cover;        
        border-radius: 14px;
    }

    /* 3. CALENDARIO CON LETRAS MÁS GRANDES */
    .calendario-interno {
        text-align: center;
        padding: 12px 0 6px 0;    
    }

    .mes {
        font-size: clamp(1.5rem, 5vw, 1.9rem); /* Letras más legibles y grandes */
        color: #333333;
        margin: 0 0 6px 0;
        letter-spacing: 2px;
        font-weight: bold;
    }

    .svg-calendario {
        width: 90%;
        max-width: 180px;         /* Incrementado el tamaño del mapa del calendario */
        height: auto;
        display: inline-block;
    }

    /* Caja de Cuenta Regresiva */
    .countdown {
        width: 100%;
        max-width: 440px;
        background: rgba(255, 255, 255, .95);
        padding: 25px 20px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .15);
        box-sizing: border-box;
    }

    .countdown h2 {
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        color: #222;
        margin: 0 0 10px 0;
    }

    #contador {
        font-size: clamp(2.5rem, 8vw, 4.2rem); /* Letras del contador un poco más grandes */
        font-weight: bold;
        color: white;
        letter-spacing: 1px;
    }

    /* Elementos informativos generales */
    .info-item {
        width: 100%;
        max-width: 500px;
        margin: 0 auto 30px auto;
        text-align: center;
    }


    .link-mapa{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:16px;

    background:#C73850;

    color:#fff;

    text-decoration:none;

    padding:20px 40px;

    border-radius:60px;

    font-size:clamp(1.6rem,5vw,2.2rem);

    font-weight:bold;

    margin:20px auto;

    box-shadow:0 6px 22px rgba(199,56,80,.4);

    transition:.3s;

}

.link-mapa span{

    color:white;

    font-size:inherit;

}

.tercera-seccion span{
    display: block;
    max-width: 900px;
    text-align: center;
    color: white;

    /* Tamaño responsivo */
    font-size: clamp(2rem, 5vw, 3.5rem);

    line-height: 1.3;
    padding: 0 20px;
}

.link-mapa:hover{
    transform:scale(1.05);
}

    .descripcion {
        max-width: 500px;
        margin: 40px auto;
        text-align: center;
        font-size: clamp(2.2rem, 7vw, 3.5rem); /* Texto de invitación más grande y elegante */
        line-height: 1.3;
        color: #ffffff;
        text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.6);
    }

    .btn-confirmar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-decoration: none;
        color: #fff;
        background: #C73850;
        padding: 20px 40px; /* Botón de WhatsApp más imponente */
        border-radius: 60px;
        font-size: clamp(1.6rem, 5vw, 2.2rem); /* Letras de confirmación más llamativas */
        font-weight: bold;
        margin: 20px auto;
        transition: transform .2s ease;
        box-shadow: 0 6px 22px rgba(199, 56, 80, 0.4);
    }

    .link-mapa:hover,
    .btn-confirmar:hover {
        transform: scale(1.04);
    }

   .icono-maps{

    width:48px;
    height:48px;

    flex-shrink:0;

}

.icono-wa{

    width:48px;
    height:48px;

}

    /* Pantallas móviles chicas */
    @media(max-width: 480px) {
        .hero {
            padding: 15px 10px;
        }
        .link-mapa, .btn-confirmar {
            width: 95%; /* Ocupa casi todo el ancho para fácil lectura */
            box-sizing: border-box;
        }
    }
</style>
</head>

<body>

   <section class="hero">

    <div class="overlay"></div>

    <div class="hero-contenido">

        <img src="recursos/textocurvo.svg"
             class="svg-curvo">

        <img src="recursos/tiara.svg"
             class="svg-icono">

        <img src="recursos/Elizabeth.svg"
             class="svg-nombre">

        <span class="faltan">
            Faltan
        </span>

        <div class="contador">

            <div class="item">
                <div class="numero" id="dias">00</div>
                <span>Días</span>
            </div>

            <div class="dospuntos">:</div>

            <div class="item">
                <div class="numero" id="horas">00</div>
                <span>Horas</span>
            </div>

            <div class="dospuntos">:</div>

            <div class="item">
                <div class="numero" id="minutos">00</div>
                <span>Min.</span>
            </div>

            <div class="dospuntos">:</div>

            <div class="item">
                <div class="numero" id="segundos">00</div>
                <span>Seg.</span>
            </div>

        </div>

          <a href="https://wa.me/5216633191218?text=Hola,%20confirmo%20mi%20asistencia%20al%20evento%20(:" target="_blank" class="btn-confirmar">
            <img src="recursos/wa.svg" alt="WhatsApp" class="icono-wa">
            <span>Confirmar asistencia</span>
        </a>

    </div>

</section>


 <section class="tercera-seccion">
 
    <span>Los momentos felices de la vida se vuelven inolvidables cuando se comparten con quien más quieres</span>


    <div class="galeria-lugar">

        <img src="recursos/Jardin10.png"
             alt="Lugar 1"
             class="foto-lugar">

        <img src="recursos/Jardin11.png"
             alt="Lugar 2"
             class="foto-lugar">

    </div>
	
	  <span>Del Nogal M2 L14 Carretera Libre Tijuana Tecate 22253, Tijuana, B.C.</span>

    <a href="https://maps.app.goo.gl/Y1HMjhvRPz2Y8iDb6"
       target="_blank"
       class="link-mapa">

        <img src="recursos/maps.svg"
             alt="Mapa"
             class="icono-maps">

        <span>Ver ubicación</span>

    </a>

</section>

    <section class="cuarta-seccion">
       <img src="recursos/7itinerario.png" alt="Itinerario">
    </section>

    <audio id="musica" loop>
        <source src="recursos/marryMusic.mp3" type="audio/mpeg">
    </audio>

    <script>
        const destino = new Date("November 20, 2026 18:00:00").getTime();
		document.getElementById("dias").textContent = dias;
        document.getElementById("minutos").textContent = minutos;
        document.getElementById("segundos").textContent = segundos;

        function actualizar() {
            const ahora = new Date().getTime();
            const diferencia = destino - ahora;

           if(diferencia<=0){

document.getElementById("dias").textContent="00";
document.getElementById("horas").textContent="00";
document.getElementById("minutos").textContent="00";
document.getElementById("segundos").textContent="00";

clearInterval(intervalo);

return;

}

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById("dias").textContent =
String(dias).padStart(2,"0");

document.getElementById("horas").textContent =
String(horas).padStart(2,"0");

document.getElementById("minutos").textContent =
String(minutos).padStart(2,"0");

document.getElementById("segundos").textContent =
String(segundos).padStart(2,"0");
        }

        actualizar();
        const intervalo = setInterval(actualizar, 1000);
    </script>

</body>
</html>
