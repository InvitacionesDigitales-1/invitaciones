<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invitación</title>

   <style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'TangerineBold', serif;
        color: black;
        background-color: #f8f9fa;
    }

    @font-face {
        font-family: 'TangerineBold';
        src: url('recursos/Tangerine-Bold.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
    }

  .hero{
    position:relative;
    min-height:100vh;
    background:url("recursos/misquince2.png") center center/cover no-repeat;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.35);
}

.hero-contenido{

    position:relative;
    z-index:2;
    width:100%;
    max-width:900px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    gap:8px;

    padding:0px;

}

 

  .cuarta-seccion{
    background:#fff;
}

.tercera-seccion{

    background:#D4A3B5;

    padding:60px 20px;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:35px;

}

.quinta-seccion{

    background:#ffffff;

    padding:60px 20px;

    display:flex;

    flex-direction:column;

    align-items:center;

}

.quinta-seccion h2{

    color:#C73850;

    font-size:clamp(2.2rem,6vw,3.5rem);

    margin-bottom:35px;

    text-align:center;

}

.formulario-confirmacion{

    width:100%;

    max-width:500px;

    display:flex;

    flex-direction:column;

    gap:20px;

}

.formulario-confirmacion input{

    width:100%;

    padding:18px 20px;

    font-size:clamp(1.1rem,3vw,1.4rem);

    border:2px solid #d9d9d9;

    border-radius:12px;

    box-sizing:border-box;

    outline:none;
    /* Forzar una fuente limpia y legible en lugar de la del body */
    font-family: Arial, Helvetica, sans-serif;

}

.formulario-confirmacion input:focus{

    border-color:#C73850;

}

.formulario-confirmacion button{

    width:100%;

    padding:20px;

    border:none;

    border-radius:60px;

    background:#C73850;

    color:#fff;

    font-size:clamp(1.2rem,4vw,1.6rem);

    font-weight:bold;

    cursor:pointer;

    transition:.25s;

}

.formulario-confirmacion button:hover{

    transform:scale(1.03);

}

.formulario-confirmacion button:disabled{

    opacity:.7;

    cursor:not-allowed;

}

.galeria-lugar{

    display:flex;
    justify-content:center;
    gap:20px;

    width:100%;
    max-width:1000px;

}

.foto-lugar{

    width:48%;
    border-radius:18px;
    object-fit:cover;

    box-shadow:0 10px 25px rgba(0,0,0,.20);

}

.cuarta-seccion img{
    width:100%;
    display:block;
}

.svg-curvo{

    width:min(320px,80vw);
    height:auto;

}

.svg-icono{

    width:min(80px,20vw);
    height:auto;

}

.svg-nombre{

    width:min(500px,90vw);
    height:auto;

}

.svg-fecha{

    width:min(220px,65vw);
    height:auto;

}

.faltan{

    color:white;

    font-size:60px;

    letter-spacing:2px;

    font-weight:bold;

}

.contador{

    display:flex;

    justify-content:center;

    align-items:flex-start;

    gap:12px;

    flex-wrap:nowrap;

}

.item{

    display:flex;

    flex-direction:column;

    align-items:center;

}

.numero{

    width:75px;

    height:85px;

    background:white;

    border-radius:8px;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:60px;

    font-weight:bold;

    color:#c9a63a;

    box-shadow:0 8px 18px rgba(0,0,0,.30);


}

.item span{

    margin-top:8px;

    color:white;

    font-size:45px;

}

.dospuntos{

    color:white;

    font-size:55px;

    margin-top:10px;

    font-weight:bold;

}

@media(max-width:768px){

.svg-curvo{

    width:320px;

}

.svg-icono{

    width:100px;

}

.svg-nombre{

    width:220px;

}

.galeria-lugar{

    gap:10px;

}

.foto-lugar{

    width:48%;

}

.numero{

    width:52px;
    height:62px;

    font-size:32px;

}

.dospuntos{

    font-size:34px;

}

.item span{

    font-size:25px;

}

.faltan{

    font-size:22px;

}

}


    .link-mapa{

    display:inline-flex;

    align-items:center;
    justify-content:center;

    gap:16px;

    background:#C73850;

    color:#fff;

    text-decoration:none;

    padding:20px 40px;

    border-radius:60px;

    font-size:clamp(1.6rem,5vw,2.2rem);

    font-weight:bold;

    margin:20px auto;

    box-shadow:0 6px 22px rgba(199,56,80,.4);

    transition:.3s;

}

.link-mapa span{

    color:white;

    font-size:inherit;

}

.tercera-seccion span{
    display: block;
    max-width: 900px;
    text-align: center;
    color: white;

    /* Tamaño responsivo */
    font-size: clamp(2rem, 5vw, 3.5rem);

    line-height: 1.3;
    padding: 0 20px;
}

.link-mapa:hover{
    transform:scale(1.05);
}


    .btn-confirmar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        text-decoration: none;
        color: #fff;
        background: #C73850;
        padding: 20px 40px; /* Botón de WhatsApp más imponente */
        border-radius: 60px;
        font-size: clamp(1.6rem, 5vw, 2.2rem); /* Letras de confirmación más llamativas */
        font-weight: bold;
        margin: 20px auto;
        transition: transform .2s ease;
        box-shadow: 0 6px 22px rgba(199, 56, 80, 0.4);
    }

    .link-mapa:hover,
    .btn-confirmar:hover {
        transform: scale(1.04);
    }

   .icono-maps{

    width:48px;
    height:48px;

    flex-shrink:0;

}

.icono-wa{

    width:48px;
    height:48px;

}

    /* Pantallas móviles chicas */
    @media(max-width: 480px) {
        .hero {
            padding: 15px 10px;
        }
        .link-mapa, .btn-confirmar {
            width: 95%; /* Ocupa casi todo el ancho para fácil lectura */
            box-sizing: border-box;
        }
    }

	   /* Seccion de Carrusel */
.seccion-carrusel {
    background: #F7F0F0;
    padding: 60px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.titulo-carrusel {
    color: #C73850;
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    margin-bottom: 25px;
    text-align: center;
}

/* Contenedor del carrusel */
#carruselQuince {
    max-width: 800px;
    margin: 0 auto;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, .15);
}

/* Ajuste de imágenes para responsividad */
.img-carrusel {
    height: 500px;
    object-fit: cover; /* Evita que las imágenes se deformen o estiren */
    object-position: center;
}

/* Adaptación para pantallas celulares */
@media(max-width: 768px) {
    .img-carrusel {
        height: 380px; /* Reduce la altura en móviles */
    }
}
</style>
</head>

<body>

 <section class="tercera-seccion">

	<!-- Sección del Carrusel de Fotos -->

	<section class="quinta-seccion">

      <h2>Confirma tu asistencia</h2>

        <div class="formulario-confirmacion">

          <input id="nombre" type="text" placeholder="Nombre completo">

          <input id="celular" type="tel" placeholder="Celular">

          <input id="asistentes" type="number" min="1" placeholder="Número de asistentes">

          <button id="btnRegistrar" onclick="registrar()">
            Confirmar asistencia
          </button>

        </div>

    </section>

    <script>
        const destino = new Date("November 20, 2026 18:00:00").getTime();

        function actualizar() {
            const ahora = new Date().getTime();
            const diferencia = destino - ahora;

           if(diferencia<=0){

document.getElementById("dias").textContent="00";
document.getElementById("horas").textContent="00";
document.getElementById("minutos").textContent="00";
document.getElementById("segundos").textContent="00";

clearInterval(intervalo);

return;

}

            const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
            const horas = Math.floor((diferencia % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutos = Math.floor((diferencia % (1000 * 60 * 60)) / (1000 * 60));
            const segundos = Math.floor((diferencia % (1000 * 60)) / 1000);

            document.getElementById("dias").textContent =
String(dias).padStart(2,"0");

document.getElementById("horas").textContent =
String(horas).padStart(2,"0");

document.getElementById("minutos").textContent =
String(minutos).padStart(2,"0");

document.getElementById("segundos").textContent =
String(segundos).padStart(2,"0");
        }

        actualizar();
        const intervalo = setInterval(actualizar, 1000);
		
const URL="https://script.google.com/macros/s/AKfycbyVsIhOPEuUqQmZnUicuJJ3fCIoQLR7M3ihtAqnuNTOjddHrN5eLRtw3qcxOP7NE8kt/exec";

async function registrar(){

    const boton = document.getElementById("btnRegistrar");

    boton.disabled = true;
    boton.innerHTML = "Registrando...";


    const datos={
        nombre:document.getElementById("nombre").value,
        celular:document.getElementById("celular").value,
        asistentes:document.getElementById("asistentes").value
    };

    if(!datos.nombre || !datos.celular || !datos.asistentes){

    alert("Completa todos los campos");
    boton.disabled=false;
    boton.innerHTML="Registrar";
    return;

}

    try {

        const respuesta = await fetch(URL,{
            method:"POST",
            body:JSON.stringify(datos)
        });


        const json = await respuesta.json();


        alert(json.mensaje);


        if(json.ok){

            boton.innerHTML="Confirmado ✓";

            document.getElementById("nombre").value="";
            document.getElementById("celular").value="";
            document.getElementById("asistentes").value="";

            // permanece bloqueado
            boton.disabled=true;

        }else{

            // Si hubo error (ejemplo celular duplicado)
            boton.disabled=false;
            boton.innerHTML="Registrar";

        }


    } catch(error){

        alert("Error al registrar");

        console.log(error);

        boton.disabled=false;
        boton.innerHTML="Registrar";

    }

}

    </script>
<script src="js/bootstrap.bundle.min.js"></script>
