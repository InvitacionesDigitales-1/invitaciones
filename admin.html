<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Invitados - Panel Admin</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-4 p-4">
          
          <h2 class="h4 text-center mb-4">Registrar Nuevo Invitado</h2>

          <form id="formRegistro">
            <div class="mb-3">
              <label for="nombre" class="form-label font-weight-bold">Nombre del Invitado o Familia:</label>
              <input type="text" id="nombre" class="form-control" placeholder="Ej. Familia Pérez / Carlos Gómez" required>
            </div>

            <div class="mb-3">
              <label for="pases" class="form-label font-weight-bold">Número de Pases:</label>
              <input type="number" id="pases" class="form-control" min="1" value="2" required>
            </div>

            <button type="submit" id="btnGuardar" class="btn btn-primary w-100 py-2">
              Generar Invitación
            </button>
          </form>

          <!-- Resultado y Enlace Generado -->
          <div id="resultado" class="mt-4 d-none alert alert-success">
            <p class="mb-1 fw-bold">¡Invitación Creada!</p>
            <p class="mb-1 text-muted small">ID asignado: <span id="resID" class="fw-bold"></span></p>
            <div class="input-group my-2">
              <input type="text" id="linkGenerado" class="form-control form-control-sm" readonly>
              <button class="btn btn-outline-secondary btn-sm" type="button" onclick="copiarLink()">Copiar</button>
            </div>
            <a id="btnWhatsApp" href="#" target="_blank" class="btn btn-success btn-sm w-100 mt-2">
              Enviar por WhatsApp
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    // Coloca aquí la URL de tu Web App de Apps Script
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwInFV6DhfLpmOQsA6m9WI3Da0Zk58dyFayoFpFgp_Gv-1PEE4NTsYxpys21neiXPyl/exec";

    document.getElementById("formRegistro").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btnGuardar = document.getElementById("btnGuardar");
      const nombre = document.getElementById("nombre").value.trim();
      const pases = parseInt(document.getElementById("pases").value);

      btnGuardar.disabled = true;
      btnGuardar.textContent = "Guardando en BD...";

      try {
        const response = await fetch(URL_BACKEND, {
          method: "POST",
          body: JSON.stringify({
            accion: "crear",
            nombre: nombre,
            pases: pases
          })
        });

        const data = await response.json();

        if (data.ok) {
          // Construir la URL completa hacia invitacion.html usando el ID generado
          const urlBase = window.location.href.replace("admin.html", "invitacion.html");
          const linkFinal = `${urlBase}?id=${data.id}`;

          document.getElementById("resID").textContent = data.id;
          document.getElementById("linkGenerado").value = linkFinal;

          // Mensaje de WhatsApp preconfigurado
          const mensajeWA = `Hola ${nombre}, te invitamos cordialmente a nuestro evento. Puedes ver todos los detalles y tus pases de acceso aquí: ${linkFinal}`;
          document.getElementById("btnWhatsApp").href = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensajeWA)}`;

          document.getElementById("resultado").classList.remove("d-none");
          document.getElementById("formRegistro").reset();
        } else {
          alert("Error: " + data.mensaje);
        }
      } catch (error) {
        console.error("Error de conexión:", error);
        alert("Ocurrió un error al registrar el invitado.");
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "Generar Invitación";
      }
    });

    function copiarLink() {
      const copyText = document.getElementById("linkGenerado");
      copyText.select();
      document.execCommand("copy");
      alert("Enlace copiado al portapapeles.");
    }
  </script>

</body>
</html>
