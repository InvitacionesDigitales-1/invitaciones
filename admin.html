<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Crear Invitación</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Carga local de QRCode -->
  <script src="recursos/qrcode.min.js"></script>
  <!-- Librería para convertir HTML a Imagen PNG -->
  <script src="recursos/html2canvas.min.js"></script>

  <style>
    body { background-color: white; color: #ffffff; }
    .card-custom { border-radius: 16px; border: none; }
    #qrcode img, #qrcode canvas { margin: 0 auto; border-radius: 8px; padding: 10px; background: #ffffff; }
    
    /* Contenedor de la tarjeta que se convertirá en imagen */
    #tarjetaQR {
      background: white;
      border: 1px solid #333;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card card-custom  text-black p-4 shadow-lg w-100" style="max-width: 450px;">
    <h2 class="h4 text-center mb-4 fw-bold">Crear Invitado</h2>

    <!-- Formulario de creación -->
    <form id="formCrear">
      <div class="mb-3">
        <label for="nombre" class="form-label text-muted small">Nombre del Invitado</label>
        <input type="text" id="nombre" class="form-control bg-secondary text-white border-0" placeholder="Ej. Familia Pérez" required>
      </div>

      <div class="mb-4">
        <label for="pases" class="form-label text-muted small">Número de Pases</label>
        <input type="number" id="pases" class="form-control bg-secondary text-white border-0" min="1" value="2" required>
      </div>

      <button type="submit" id="btnGuardar" class="btn btn-warning w-100 py-3 rounded-pill fw-bold">
        Generar Invitación
      </button>
    </form>

    <!-- Sección del Resultado (Oculta inicialmente) -->
    <div id="resultadoContainer" class="d-none mt-4 pt-3 border-top border-secondary text-center">
      
      <!-- Tarjeta que se exportará a Imagen PNG -->
      <div id="tarjetaQR" class="p-4 rounded-3 mb-3 text-center">
        <small class="text-warning fw-bold text-uppercase d-block mb-1" style="letter-spacing: 1px;">Invitacion y pases</small>
        <h3 id="previewNombre" class="h5 fw-bold text-white mb-3">---</h3>
        <div id="qrcode" class="d-flex justify-content-center mb-3"></div>
        <span id="previewPases" class="badge bg-warning text-dark mb-2">2 Pases</span>
        <small id="previewID" class="text-muted d-block font-monospace">ID: ---</small>
      </div>

      <!-- Botón para Descargar Imagen PNG -->
      <button id="btnDescargarPNG" class="btn btn-outline-light w-100 py-2 rounded-pill fw-bold mb-2">
        📷 Descargar Imagen (PNG)
      </button>

      <!-- Botón para enviar por WhatsApp -->
      <a id="btnWhatsapp" href="#" target="_blank" class="btn btn-success w-100 py-2 rounded-pill fw-bold mb-2">
         Enviar por WhatsApp
      </a>

      <button type="button" id="btnNuevo" class="btn btn-link btn-sm w-100 text-muted text-decoration-none">
        + Crear otra invitación
      </button>
    </div>

  </div>

  <script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwInFV6DhfLpmOQsA6m9WI3Da0Zk58dyFayoFpFgp_Gv-1PEE4NTsYxpys21neiXPyl/exec";
    let nombreInvitadoActual = "Invitacion";

    document.getElementById("formCrear").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btnGuardar = document.getElementById("btnGuardar");
      const nombre = document.getElementById("nombre").value.trim();
      const pases = parseInt(document.getElementById("pases").value);
      nombreInvitadoActual = nombre;

      btnGuardar.disabled = true;
      btnGuardar.textContent = "Guardando en BD...";

      try {
        const res = await fetch(URL_BACKEND, {
          method: "POST",
          body: JSON.stringify({
            accion: "crear",
            nombre: nombre,
            pases: pases
          })
        });

        const data = await res.json();

        if (data.ok) {
          const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
          const linkInvitacion = `${baseUrl}/invitacion.html?id=${data.id}`;

          // Actualizar datos en la tarjeta
          document.getElementById("previewNombre").textContent = nombre;
          document.getElementById("previewPases").textContent = `${pases} Pase(s)`;
          document.getElementById("previewID").textContent = `ID: ${data.id}`;

          // Generar Código QR
          document.getElementById("qrcode").innerHTML = "";
          new QRCode(document.getElementById("qrcode"), {
            text: linkInvitacion,
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
          });

          // Configurar WhatsApp
          const mensajeWA = `¡Hola ${nombre}! 👋\nAquí tienes tu pase digital para el evento.\n\n🎟️ Pases asignados: ${pases}\n👉 Ver Invitación y QR: ${linkInvitacion}`;
          document.getElementById("btnWhatsapp").href = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensajeWA)}`;

          // Mostrar tarjeta resultado
          document.getElementById("formCrear").classList.add("d-none");
          document.getElementById("resultadoContainer").classList.remove("d-none");

        } else {
          alert("Error al crear la invitación: " + data.mensaje);
        }

      } catch (err) {
        console.error("Error:", err);
        alert("Ocurrió un error al conectar con el servidor.");
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "Generar Invitación";
      }
    });

    // Función para convertir la tarjeta HTML a archivo PNG y descargarlo
    document.getElementById("btnDescargarPNG").addEventListener("click", () => {
      const tarjeta = document.getElementById("tarjetaQR");

      html2canvas(tarjeta, {
        backgroundColor: "#1e1e1e",
        scale: 2 // Mayor resolución para la imagen descargada
      }).then((canvas) => {
        const link = document.createElement("a");
        link.download = `Pase_${nombreInvitadoActual.replace(/\s+/g, '_')}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    });

    // Reiniciar formulario
    document.getElementById("btnNuevo").addEventListener("click", () => {
      document.getElementById("formCrear").reset();
      document.getElementById("formCrear").classList.remove("d-none");
      document.getElementById("resultadoContainer").classList.add("d-none");
    });
  </script>
</body>
</html>
