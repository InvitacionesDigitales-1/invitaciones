<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Crear Invitación</title>
  <link href="css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Carga local de la librería QRCode -->
  <script src="recursos/qrcode.min.js"></script>

  <style>
    body { background-color: #121212; color: #ffffff; }
    .card-custom { border-radius: 16px; border: none; }
    #qrcode img, #qrcode canvas { margin: 0 auto; border-radius: 8px; padding: 10px; background: #ffffff; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="card card-custom bg-dark text-white p-4 shadow-lg w-100" style="max-width: 450px;">
    <h2 class="h4 text-center mb-4 fw-bold">Crear Invitado</h2>

    <!-- Formulario de creación -->
    <form id="formCrear">
      <div class="mb-3">
        <label for="nombre" class="form-label text-muted small">Nombre del Invitado</label>
        <input type="text" id="nombre" class="form-control bg-secondary text-white border-0" placeholder="Ej. Familia Pérez" required>
      </div>

      <div class="mb-4">
        <label for="pases" class="form-label text-muted small">Número de Pases</label>
        <input type="number" id="pases" class="form-control bg-secondary text-white border-0" min="1" value="2" required>
      </div>

      <button type="submit" id="btnGuardar" class="btn btn-warning w-100 py-3 rounded-pill fw-bold">
        Generar Invitación
      </button>
    </form>

    <!-- Tarjeta del QR Generado (Oculta inicialmente) -->
    <div id="resultadoContainer" class="d-none mt-4 pt-3 border-top border-secondary text-center">
      
      <!-- Tarjeta preview -->
      <div class="bg-secondary bg-opacity-25 p-3 rounded-3 mb-3">
        <h3 id="previewNombre" class="h5 fw-bold text-warning mb-3">---</h3>
        <div id="qrcode" class="d-flex justify-content-center mb-2"></div>
        <small id="previewID" class="text-muted d-block">ID: ---</small>
      </div>

      <!-- Botón para enviar por WhatsApp -->
      <a id="btnWhatsapp" href="#" target="_blank" class="btn btn-success w-100 py-2 rounded-pill fw-bold mb-2">
         Enviar por WhatsApp
      </a>

      <button type="button" id="btnNuevo" class="btn btn-outline-light btn-sm w-100 border-0 text-muted">
        + Crear otra invitación
      </button>
    </div>

  </div>

  <script>
    const URL_BACKEND = "https://script.google.com/macros/s/AKfycbwInFV6DhfLpmOQsA6m9WI3Da0Zk58dyFayoFpFgp_Gv-1PEE4NTsYxpys21neiXPyl/exec";

    document.getElementById("formCrear").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btnGuardar = document.getElementById("btnGuardar");
      const nombre = document.getElementById("nombre").value.trim();
      const pases = parseInt(document.getElementById("pases").value);

      btnGuardar.disabled = true;
      btnGuardar.textContent = "Guardando en BD...";

      try {
        // Guardar en Google Sheets vía Apps Script
        const res = await fetch(URL_BACKEND, {
          method: "POST",
          body: JSON.stringify({
            accion: "crear",
            nombre: nombre,
            pases: pases
          })
        });

        const data = await res.json();

        if (data.ok) {
          // Obtener dinámicamente la ruta base donde está corriendo el proyecto (ej: http://localhost:5500 o https://tudominio.com/proyecto)
          const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
          const linkInvitacion = `${baseUrl}/invitacion.html?id=${data.id}`;

          // Actualizar interfaz visual
          document.getElementById("previewNombre").textContent = nombre;
          document.getElementById("previewID").textContent = `ID de Pase: ${data.id}`;

          // Generar código QR localmente
          document.getElementById("qrcode").innerHTML = ""; // Limpiar previo
          new QRCode(document.getElementById("qrcode"), {
            text: linkInvitacion,
            width: 180,
            height: 180,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
          });

          // Configurar texto y link de WhatsApp
          const mensajeWA = `¡Hola ${nombre}! 👋\nAquí tienes tu pase digital para el evento.\n\n🎟️ Pases asignados: ${pases}\n👉 Ver Invitación y QR: ${linkInvitacion}`;
          const urlWhatsapp = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensajeWA)}`;
          
          document.getElementById("btnWhatsapp").href = urlWhatsapp;

          // Ocultar formulario y mostrar la tarjeta con el QR
          document.getElementById("formCrear").classList.add("d-none");
          document.getElementById("resultadoContainer").classList.remove("d-none");

        } else {
          alert("Error al crear invitación: " + data.mensaje);
        }

      } catch (err) {
        console.error("Error:", err);
        alert("Ocurrió un error al conectar con el servidor.");
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "Generar Invitación";
      }
    });

    // Botón para reiniciar el formulario
    document.getElementById("btnNuevo").addEventListener("click", () => {
      document.getElementById("formCrear").reset();
      document.getElementById("formCrear").classList.remove("d-none");
      document.getElementById("resultadoContainer").classList.add("d-none");
    });
  </script>
</body>
</html>
