<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación</title>

    <!-- Bootstrap CSS Local -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Eliminamos márgenes por defecto del navegador */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        /* Primera sección: Ocupa la pantalla completa */
        .seccion-hero {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #ffffff; /* Fondo neutro de respaldo */
        }

        /* La imagen ocupa todo el espacio sin deformarse */
        .seccion-hero img {
            width: 100%;
            height: 100%;
            max-height: 100vh;
            object-fit: contain; /* Mantiene la proporción de tu PNG sin recortarlo */
            display: block;
        }

        /* Ajuste responsivo para pantallas móviles */
        @media (max-width: 768px) {
            .seccion-hero {
                min-height: auto;
            }
            .seccion-hero img {
                height: auto;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <!-- PRIMERA SECCIÓN: SOLO LA IMAGEN PNG -->
    <section class="seccion-hero">
        <!-- Reemplaza 'recursos/tu_imagen.png' por la ruta exacta de tu archivo -->
        <img src="recursos/casados.png" alt="Imagen Principal" class="img-fluid">
    </section>

    <!-- Bootstrap JS Local -->
    <script src="js/bootstrap.bundle.min.js"></script>

</body>
</html>
